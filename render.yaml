services:
  - type: web
    name: investaide
    runtime: python
    plan: free
    branch: main
    buildCommand: bash build.sh
    startCommand: gunicorn core.wsgi:application --worker-class gthread --workers 1 --threads 4 --max-requests 500 --max-requests-jitter 50 --timeout 120 --keep-alive 5
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: "1"
